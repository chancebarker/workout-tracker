name: CI

# Validates the IaC and frontend on every push / PR. No AWS credentials needed:
# `cdk synth` + cdk-nag run entirely locally, and the assertion tests skip Lambda bundling.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  infra:
    name: Infra (tests + cdk-nag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install infra deps
        run: npm ci
      - name: Install Lambda deps (needed for cdk synth bundling)
        run: npm ci
        working-directory: infra/lambda/api
      - name: Assertion tests
        run: npm test
      - name: Security lint (cdk-nag)
        run: npm run nag

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
